name: republish-release
on: workflow_dispatch
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SRC: d4j-run-archives
      DST: defects4j-run-archives
    steps:
      - name: copy assets one at a time
        run: |
          gh release view "$DST" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$DST" -R "$GITHUB_REPOSITORY" \
              --title "Defects4J per-bug run archives" \
              --notes "Compressed per-project working trees of the 828-bug change-impact study, split into <2 GB parts, plus the run manifest, provenance, results, checksums, and logs. Integrity: SHA256SUMS."
          have=$(gh release view "$DST" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for a in $(gh release view "$SRC" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            echo "$have" | grep -qx "$a" && { echo "skip $a"; continue; }
            echo ">> $a"
            gh release download "$SRC" -R "$GITHUB_REPOSITORY" --pattern "$a" -D /tmp/x
            gh release upload "$DST" -R "$GITHUB_REPOSITORY" "/tmp/x/$a"
            rm -f "/tmp/x/$a"
          done
          echo OK
